name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test
        working-directory: src-tauri

  # Nobody here owns a Linux box, so this is the only thing that ever compiles
  # the #[cfg(target_os = "linux")] paths. 22.04 to match release.yml.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Same package list as release.yml, so green here predicts green at tag
      # time. A missing -dev package surfaces as an opaque pkg-config failure.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
